<!DOCTYPE html>
<!-- Offline wrapper for the OFFICIAL OneSlime JS port (oneslime.net).
     The game self-starts via window.onload and needs only #canvas.
     Domain-lock note: the script scales the canvas by a checksum of the
     last 12 chars of location.hostname (zero-sum for "oneslime.net");
     file:// URLs have an EMPTY hostname, so the loop body never runs and
     the scale stays 1 — vendored play works unpatched. -->
<html>
<head>
<meta charset="utf-8">
<title>Slime Volleyball</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas" width="750" height="375"></canvas>
<script src="OneSlime.min.js" type="text/javascript"></script>
</body>
</html>
